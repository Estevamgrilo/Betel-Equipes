# Ambiente de desenvolvimento/teste; NÃO publicar a porta do banco na internet.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: betel_test
      POSTGRES_USER: betel_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Defina POSTGRES_TEST_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betel_test -d betel_test"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - betel_pg_test:/var/lib/postgresql/data
volumes:
  betel_pg_test:
