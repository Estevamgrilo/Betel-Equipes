<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Betel Equipes — Plataforma</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#20304b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:white;border-right:1px solid #e8edf5;padding:25px 15px;flex-shrink:0}.brand{font-weight:800;font-size:19px;margin-bottom:35px}.brand small{display:block;font-size:10px;color:#7d90a9;letter-spacing:.13em;text-transform:uppercase}nav button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:#50627f}nav button.active{background:#eaf1ff;color:#3268e9}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8edf5;padding:20px 35px;display:flex;justify-content:space-between;gap:12px;align-items:center}.content{max-width:1160px;margin:40px auto;padding:0 25px}h1{font-size:27px;margin:5px 0}h2{font-size:18px}p{color:#74839b}.card{background:white;border:1px solid #e6ecf5;border-radius:20px;padding:25px;margin:18px 0;box-shadow:0 8px 25px #1c355b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.grid .card{margin:0}button,.button{border:0;background:#3268e9;color:white;padding:11px 16px;border-radius:11px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.button.secondary{background:#eaf0fa;color:#244269}input,select,textarea{border:1px solid #dbe4f1;border-radius:10px;padding:11px;width:100%;font:inherit;background:white;margin:6px 0 13px}label{font-weight:600;font-size:12px;display:block}.muted{color:#7c8aa2}.item{border-bottom:1px solid #e8edf5;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.item:last-child{border:0}.hidden{display:none!important}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f4f7fc;padding:12px;border-radius:10px}#msg{font-weight:600;margin:15px 0}.pill{background:#eaf1ff;color:#3268e9;padding:6px 10px;border-radius:18px;font-size:12px}@media(max-width:700px){.app{display:block}.side{width:auto;padding:14px}.brand{margin:0 0 12px}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{width:auto}.top{padding:15px}.content{padding:0 15px;margin:25px auto}}</style></head><body><div class="app"><aside class="side"><div class="brand">✦ Betel Equipes<small>Gestão de voluntários</small></div><nav id="nav"></nav></aside><div class="main"><div class="top"><span id="who">Betel Equipes</span><div><a class="button secondary" href="/cadastro.html">Meu cadastro</a> <button class="secondary" id="logout">Sair</button></div></div><main class="content"><span class="muted">IGREJA BATISTA BETEL · UMUARAMA</span><h1 id="title">Minha plataforma</h1><p id="description">Informações da sua equipe</p><div id="view"></div></main></div></div><script>
const token=sessionStorage.getItem('betel_token');if(!token)location.replace('/');const $=id=>document.getElementById(id);let me,users=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const age=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00'),n=new Date();let y=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;return y>=0?y:'—'};
async function api(route,method='GET',body){const r=await fetch('/api/'+route,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Erro de acesso');return x}
$('logout').onclick=async()=>{try{await api('logout','POST',{})}catch{}sessionStorage.removeItem('betel_token');location.replace('/')};
const leader=()=>['master','general','sector'].includes(me.role);
const pages=()=>[...(leader()?[['home','Visão geral']]:[]),['schedule','Escalas'],['learning','Aprendizado'],...(leader()?[['people','Voluntários'],['manage','Gestão operacional']]:[])];
let current='schedule';function navigate(page){current=page;$('nav').innerHTML=pages().map(([id,label])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));const labels={home:'Visão geral',schedule:'Minhas escalas',learning:'Meu aprendizado',people:'Voluntários',manage:'Gestão operacional'};$('title').textContent=labels[page]||'Betel Equipes';$('description').textContent=page==='people'?'Cadastros reais e histórico de alterações':page==='schedule'?'Agenda e escalas cadastradas pela liderança':'Acompanhe suas atividades e equipes';if(page==='people')return showPeople();if(page==='schedule')return showSchedule();if(page==='learning')return $('view').innerHTML='<div class="card"><h2>Trilhas de aprendizado</h2><p>Não há cursos reais cadastrados no momento. Nenhum dado demonstrativo é exibido.</p></div>';if(page==='manage'){$('view').innerHTML='<div class="card"><h2>Administração e escalas</h2><p>Acesse as ferramentas operacionais de gestão, convites e escalas.</p><a class="button" href="/painel.html">Acessar minha plataforma operacional</a></div>'+(me.role==='master'?'<div class="card"><h2>Reiniciar dados de teste</h2><p>Exclui todos os usuários, convites, escalas, eventos e registros de teste. Preserva somente a conta Master autorizada. Esta operação não pode ser desfeita.</p><button id="resetData">Zerar dados de teste</button><p id="resetStatus"></p></div>':'');if(me.role==='master')$('resetData').onclick=resetTestData;return}$('view').innerHTML='<div class="grid"><div class="card"><h2>Minha equipe</h2><p>'+esc((me.sectors||[]).join(', ')||'Sem equipe vinculada')+'</p></div><div class="card"><h2>Cadastros</h2><p>Gerencie os voluntários autorizados, com dados reais.</p><button onclick="navigate(\'people\')">Abrir voluntários</button></div></div>'}
async function resetTestData(){if(me.role!=='master')return;const confirmation=prompt('Para confirmar a exclusão permanente dos dados de teste, digite exatamente: ZERAR BETEL EQUIPES');if(confirmation!=='ZERAR BETEL EQUIPES')return;const email=prompt('Confirme o e-mail da conta Master que deve permanecer:');if(email!=='estevamgrilo@hotmail.com')return;try{const result=await api('admin/reset-test-data','POST',{confirmation,keepEmail:email});alert(result.message||'Reset concluído.');sessionStorage.removeItem('betel_token');location.replace('/')}catch(e){$('resetStatus').textContent=e.message}}
async function showSchedule(){try{const d=await api('events');const events=d.events||[];$('view').innerHTML='<div class="card"><h2>Agenda e escalas</h2>'+(events.length?events.map(e=>'<div class="item"><div><b>'+esc(e.title||e.name||'Evento')+'</b><p>'+esc(e.date||e.startsAt||'')+'</p></div></div>').join(''):'<p>Nenhum evento cadastrado. A plataforma não exibe escalas fictícias.</p>')+'</div>'}catch(e){$('view').textContent=e.message}}
async function showPeople(){if(me.role!=='master'){try{const d=await api('users');$('view').innerHTML='<div class="card"><h2>Voluntários da equipe</h2>'+(d.users||[]).map(u=>'<div class="item">'+esc(u.name)+'</div>').join('')+'</div>'}catch(e){$('view').textContent=e.message}return}try{const d=await api('admin/users');users=d.users;$('view').innerHTML='<div class="card"><h2>Voluntários cadastrados</h2><p>'+users.length+' usuário(s) no banco de dados.</p><div id="list"></div></div><div id="editor"></div>'; $('list').innerHTML=users.map(u=>'<div class="item"><div><b>'+esc(u.name)+'</b><p>'+esc(u.email)+' · '+esc(u.role)+'</p></div><button data-id="'+esc(u.id)+'">Ver / editar</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>editUser(b.dataset.id))}catch(e){$('view').textContent=e.message}}
async function editUser(id){selected=users.find(u=>u.id===id);if(!selected)return;const p=selected.profile||{};const fields=[['name','Nome completo'],['phone','Telefone / WhatsApp'],['birthDate','Nascimento','date'],['address','Endereço'],['city','Cidade'],['state','Estado'],['postalCode','CEP'],['education','Escolaridade / formação'],['course','Curso'],['profession','Profissão / emprego'],['maritalStatus','Situação conjugal'],['favoriteFood','Comida preferida'],['hobbies','Hobbies / lazer']];const input=([key,label,type])=>'<label>'+label+'<input data-field="'+key+'" type="'+(type||'text')+'" value="'+esc(p[key]??(key==='name'?selected.name:''))+'"></label>';$('editor').innerHTML='<div class="card"><h2>Cadastro de '+esc(selected.name)+'</h2><div class="grid">'+fields.map(input).join('')+'</div><p>Idade atual: '+age(p.birthDate)+'</p><label>Tem filhos?<select id="hasChildren"><option value="false">Não</option><option value="true" '+(p.hasChildren?'selected':'')+'>Sim</option></select></label><label>Filhos (JSON com nome e data de nascimento)<textarea id="children" rows="4"></textarea></label><p>'+((p.children||[]).map(c=>esc(c.name||'Filho')+': '+age(c.birthDate)+' anos').join(' · ')||'Nenhum filho cadastrado')+'</p><label>Áreas de interesse (separadas por vírgula)<textarea id="interests" rows="2"></textarea></label><label>E-mail<input id="email" type="email" value="'+esc(selected.email)+'"></label><label>Nova senha (deixe em branco para manter a atual)<input id="password" type="password" autocomplete="new-password" minlength="10"></label><button id="save">Salvar alterações</button><div id="msg"></div><h2>Histórico deste usuário</h2><div id="history">Carregando...</div></div>';$('children').value=JSON.stringify(p.children||[],null,2);$('interests').value=(p.interests||[]).join(', ');$('save').onclick=saveUser;try{const d=await api('admin/user-history?userId='+encodeURIComponent(id));$('history').innerHTML=(d.audit||[]).length?(d.audit||[]).map(a=>'<div class="item"><div><b>'+esc(a.action)+'</b><p>'+esc(a.at)+' · '+esc(JSON.stringify(a.changes||a.changed||{}))+'</p></div></div>').join(''):'<p>Nenhuma alteração registrada.</p>'}catch(e){$('history').textContent=e.message}$('editor').scrollIntoView({behavior:'smooth'})}
async function saveUser(){try{const p={};document.querySelectorAll('[data-field]').forEach(x=>p[x.dataset.field]=x.value);p.hasChildren=$('hasChildren').value==='true';p.children=JSON.parse($('children').value||'[]');p.interests=$('interests').value.split(',').map(x=>x.trim()).filter(Boolean);const body={userId:selected.id,email:$('email').value,profile:p};if($('password').value)body.password=$('password').value;await api('admin/user','POST',body);$('msg').style.color='#14865b';$('msg').textContent='Alterações salvas.';await showPeople();editUser(selected.id)}catch(e){$('msg').style.color='#b33d4d';$('msg').textContent=e.message}}
(async()=>{try{const d=await api('me');me=d.user;$('who').textContent=me.name+' · '+({master:'Master',general:'Liderança geral',sector:'Liderança de equipe',volunteer:'Voluntário'}[me.role]||me.role);if(!me.profileComplete&&me.role!=='master'){location.replace('/cadastro.html');return}navigate(leader()?'home':'schedule')}catch(e){sessionStorage.removeItem('betel_token');location.replace('/')}})();
</script></body></html>
