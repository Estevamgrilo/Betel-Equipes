<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Betel Equipes — Plataforma</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#20304b;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:white;border-right:1px solid #e8edf5;padding:25px 15px;flex-shrink:0}.brand{font-weight:800;font-size:19px;margin-bottom:35px}.brand small{display:block;font-size:10px;color:#7d90a9;letter-spacing:.13em;text-transform:uppercase}nav button{display:block;width:100%;text-align:left;margin:6px 0;background:transparent;color:#50627f}nav button.active{background:#eaf1ff;color:#3268e9}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #e8edf5;padding:20px 35px;display:flex;justify-content:space-between;gap:12px;align-items:center}.content{max-width:1160px;margin:40px auto;padding:0 25px}h1{font-size:27px;margin:5px 0}h2{font-size:18px}p{color:#74839b}.card{background:white;border:1px solid #e6ecf5;border-radius:20px;padding:25px;margin:18px 0;box-shadow:0 8px 25px #1c355b08}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.grid .card{margin:0}button,.button{border:0;background:#3268e9;color:white;padding:11px 16px;border-radius:11px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}button.secondary,.button.secondary{background:#eaf0fa;color:#244269}input,select,textarea{border:1px solid #dbe4f1;border-radius:10px;padding:11px;width:100%;font:inherit;background:white;margin:6px 0 13px}label{font-weight:600;font-size:12px;display:block}.muted{color:#7c8aa2}.item{border-bottom:1px solid #e8edf5;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.item:last-child{border:0}.hidden{display:none!important}pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f4f7fc;padding:12px;border-radius:10px}#msg{font-weight:600;margin:15px 0}.pill{background:#eaf1ff;color:#3268e9;padding:6px 10px;border-radius:18px;font-size:12px}@media(max-width:700px){.app{display:block}.side{width:auto;padding:14px}.brand{margin:0 0 12px}nav{display:flex;flex-wrap:wrap;gap:5px}nav button{width:auto}.top{padding:15px}.content{padding:0 15px;margin:25px auto}} .child-row{display:grid;grid-template-columns:minmax(180px,2fr) minmax(140px,1fr) 75px auto;gap:10px;align-items:end;padding:12px;border:1px solid #e6ecf5;border-radius:12px;margin:9px 0;background:#f9fbff}.child-row label{margin:0}.child-row input{margin-bottom:0}.child-age{padding-bottom:12px;color:#74839b;font-size:12px}.audit-entry{border:1px solid #e6ecf5;border-radius:13px;padding:15px;margin:12px 0;background:#fbfcff}.audit-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.audit-time{font-size:12px;color:#74839b}.audit-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.audit-tags span{background:#eaf1ff;border-radius:15px;padding:6px 10px;font-size:12px;color:#335b99}@media(max-width:700px){.child-row{grid-template-columns:1fr 1fr}.child-row label:first-child{grid-column:1/-1}} .notice-overlay{position:fixed;inset:0;background:#14243c99;z-index:100;display:grid;place-items:center;padding:20px}.notice-modal{background:white;width:min(520px,100%);border-radius:22px;padding:26px;box-shadow:0 25px 70px #14243c35}.notice-count{background:#e9f0ff;color:#2356b4;border-radius:99px;padding:3px 8px;font-size:12px}.notice-row{padding:15px;border-bottom:1px solid #e6ecf5}.notice-row:last-child{border-bottom:0}.notice-row p{margin:8px 0}.notice-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:15px}.betel-toast{position:fixed;right:22px;top:22px;z-index:99999;max-width:min(430px,calc(100vw - 32px));min-width:260px;display:flex;align-items:center;gap:12px;background:#fff;color:#20304b;border:1px solid #dce7f5;border-left:5px solid #2f70e9;border-radius:17px;padding:15px 14px 15px 17px;box-shadow:0 18px 55px #1d34552b;font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;animation:betel-toast-in .22s ease}.betel-toast.error{border-left-color:#d74848}.betel-toast span{flex:1;line-height:1.45}.betel-toast button{background:#edf2fa!important;color:#284469!important;border:0!important;border-radius:9px!important;padding:6px 10px!important;min-width:32px!important;cursor:pointer;font-size:19px!important;line-height:1!important}@keyframes betel-toast-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.betel-toast{left:16px;right:16px;max-width:none;min-width:0}}</style></head><body><div class="app"><aside class="side"><div class="brand">✦ Betel Equipes<small>Gestão de voluntários</small></div><nav id="nav"></nav></aside><div class="main"><div class="top"><span id="who">Betel Equipes</span><div><button class="secondary" id="noticesButton" type="button">Notificações <span id="noticesCount" class="notice-count hidden">0</span></button> <a class="button secondary" href="/cadastro.html">Meu cadastro</a> <button class="secondary" id="logout">Sair</button></div></div><main class="content"><span class="muted">IGREJA BATISTA BETEL · UMUARAMA</span><h1 id="title">Minha plataforma</h1><p id="description">Informações da sua equipe</p><div id="view"></div></main></div></div><div id="noticeOverlay" class="notice-overlay hidden" role="dialog" aria-modal="true" aria-label="Notificações de escala"><div class="notice-modal"><h2>Suas notificações de escala</h2><div id="noticeItems"></div><div class="notice-actions"><button id="noticeClose" type="button">Fechar</button></div></div></div><script>let betelToastTimer;function betelToast(message,type='success'){let box=document.getElementById('betel-toast');if(!box){box=document.createElement('div');box.id='betel-toast';box.className='betel-toast';box.setAttribute('role','status');box.setAttribute('aria-live','polite');const label=document.createElement('span');const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','Fechar notificação');close.onclick=()=>{clearTimeout(betelToastTimer);box.remove()};box.append(label,close);document.body.append(box)}box.className='betel-toast'+(type==='error'?' error':'');box.firstElementChild.textContent=message;clearTimeout(betelToastTimer);betelToastTimer=setTimeout(()=>box.remove(),3000)}function betelActionMessage(path){const key=String(path).split('?')[0];if(/logout|notifications\/read|courses\/progress/.test(key))return null;const names={'events':'Evento cadastrado com sucesso.','events/update':'Evento atualizado com sucesso.','events/delete':'Evento excluído com sucesso.','assignments':'Escala atualizada com sucesso.','proposals':'Proposta gerada com sucesso.','proposals/approve':'Proposta aprovada com sucesso.','courses':'Curso salvo com sucesso.','courses/delete':'Curso excluído com sucesso.','profile':'Cadastro salvo com sucesso.','unavailability':'Indisponibilidade cadastrada.','unavailability/remove':'Indisponibilidade removida.'};return names[key]||'Alterações salvas com sucesso.'}
const BETEL_GRACE=3600000;function getBetelToken(){try{const raw=localStorage.getItem('betel_login_cache');if(raw){const item=JSON.parse(raw);if(item.until>Date.now()&&item.token){sessionStorage.setItem('betel_token',item.token);return item.token}localStorage.removeItem('betel_login_cache');sessionStorage.removeItem('betel_token');return null}}catch{}const old=sessionStorage.getItem('betel_token');if(old)localStorage.setItem('betel_login_cache',JSON.stringify({token:old,until:Date.now()+BETEL_GRACE}));return old}function extendBetelLogin(){const t=sessionStorage.getItem('betel_token');if(t&&document.visibilityState==='visible')localStorage.setItem('betel_login_cache',JSON.stringify({token:t,until:Date.now()+BETEL_GRACE}))}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){extendBetelLoginHidden()}else if(!getBetelToken()){location.replace('/')}else extendBetelLogin()});function extendBetelLoginHidden(){const t=sessionStorage.getItem('betel_token');if(t)localStorage.setItem('betel_login_cache',JSON.stringify({token:t,until:Date.now()+BETEL_GRACE}))}window.addEventListener('pagehide',extendBetelLoginHidden);setInterval(extendBetelLogin,60000);const token=getBetelToken();if(!token)location.replace('/');const $=id=>document.getElementById(id);let me,users=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const age=s=>{if(!s)return '—';const d=new Date(s+'T12:00:00'),n=new Date();let y=n.getFullYear()-d.getFullYear();if(n.getMonth()<d.getMonth()||(n.getMonth()===d.getMonth()&&n.getDate()<d.getDate()))y--;return y>=0?y:'—'};
async function api(route,method='GET',body){const r=await fetch('/api/'+route,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok){betelToast(x.error||'Não foi possível concluir a ação.','error');throw Error(x.error||'Erro de acesso')}if(method.toUpperCase()!=='GET'){const msg=betelActionMessage(route);if(msg)betelToast(msg)}return x}
$('logout').onclick=async()=>{try{await api('logout','POST',{})}catch{}sessionStorage.removeItem('betel_token');localStorage.removeItem('betel_login_cache');location.replace('/')};
let notices=[],noticeShown=false;async function fetchNotices(auto=false){try{const data=await api('notifications');notices=data.notifications||[];const unread=notices.filter(n=>!n.readAt);$('noticesCount').textContent=unread.length;$('noticesCount').classList.toggle('hidden',!unread.length);if(auto&&unread.length&&!noticeShown){noticeShown=true;openNotices()}}catch(e){console.warn('Notificações indisponíveis',e.message)}}
function openNotices(){const unread=notices.filter(n=>!n.readAt);$('noticeItems').innerHTML=(unread.length?unread:notices.slice(0,10)).map(n=>'<div class="notice-row"><strong>'+esc(n.title)+'</strong><p>'+esc(n.message)+'</p><small class="muted">'+new Date(n.createdAt).toLocaleString('pt-BR')+'</small> '+(!n.readAt?'<button class="secondary" data-read="'+esc(n.id)+'">Marcar como lida</button>':'')+'</div>').join('')||'<p>Você não tem notificações no momento.</p>';$('noticeOverlay').classList.remove('hidden');document.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{try{await api('notifications/read','POST',{id:b.dataset.read});await fetchNotices();openNotices()}catch(e){alert(e.message)}})}
$('noticesButton').onclick=()=>openNotices();$('noticeClose').onclick=()=>{$('noticeOverlay').classList.add('hidden')};
async function loadNotificationStatus(){try{const d=await api('admin/notification-status');const channels=d.channels||{},counts=d.counts||{};$('notificationStatus').innerHTML='<p><b>E-mail:</b> '+(channels.email?'Configurado':'Pendente de configuração')+'</p><p><b>WhatsApp:</b> '+(channels.whatsapp?'Configurado':'Pendente de configuração')+'</p>'+Object.entries(counts).map(([k,v])=>'<div class="item"><span>'+esc(k.replace(':sent',': enviado').replace(':pending',': aguardando').replace(':unconfigured',': sem configuração').replace(':failed',': falhou').replace(':cancelled',': cancelado'))+'</span><b>'+v+'</b></div>').join('')}catch(e){if($('notificationStatus'))$('notificationStatus').textContent=e.message}}
const leader=()=>['master','general','sector'].includes(me.role);
const pages=()=>[...(leader()?[['home','Visão geral']]:[]),['schedule','Escalas'],['learning','Aprendizado'],...(leader()?[['people','Voluntários'],...(me.role==='master'?[['courses','Gerenciar cursos']]:[]),['manage','Gestão operacional']]:[])];
let current='schedule';function navigate(page){current=page;if(!['learning','courses'].includes(page))history.replaceState(null,'','#'+page);$('nav').innerHTML=pages().map(([id,label])=>'<button data-page="'+id+'" class="'+(page===id?'active':'')+'">'+label+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));const labels={home:'Visão geral',schedule:'Minhas escalas',learning:'Meu aprendizado',people:'Voluntários',manage:'Gestão operacional',courses:'Gerenciar cursos'};$('title').textContent=labels[page]||'Betel Equipes';$('description').textContent=page==='people'?'Cadastros reais e histórico de alterações':page==='schedule'?'Agenda e escalas cadastradas pela liderança':'Acompanhe suas atividades e equipes';if(page==='courses'||page==='learning'){location.href='/cursos.html';return}if(page==='people')return showPeople();if(page==='schedule')return showSchedule();if(page==='manage'){$('view').innerHTML='<div class="card"><h2>Administração e escalas</h2><p>Acesse as ferramentas operacionais de gestão, convites e escalas.</p><a class="button" href="/painel.html">Acessar minha plataforma operacional</a></div>'+(me.role==='master'?'<div class="card"><h2>Envio de notificações</h2><p>Consulte a configuração dos canais e o estado dos avisos automáticos.</p><div id="notificationStatus">Consultando...</div></div><div class="card"><h2>Limpeza de dados</h2><p>Exclui permanentemente os cadastros, convites, escalas, eventos e demais registros. Preserva somente a conta Master autorizada. Esta operação não pode ser desfeita.</p><button id="resetData">Limpar dados do sistema</button><p id="resetStatus"></p></div>':'');if(me.role==='master'){$('resetData').onclick=resetTestData;loadNotificationStatus()}return}$('view').innerHTML='<div class="grid"><div class="card"><h2>Minha equipe</h2><p>'+esc((me.sectors||[]).join(', ')||'Sem equipe vinculada')+'</p></div><div class="card"><h2>Cadastros</h2><p>Gerencie os voluntários autorizados, com dados reais.</p><button onclick="navigate(\'people\')">Abrir voluntários</button></div></div>'}
async function resetTestData(){if(me.role!=='master')return;const confirmation=prompt('Para confirmar a exclusão permanente dos dados de teste, digite exatamente: ZERAR BETEL EQUIPES');if(confirmation!=='ZERAR BETEL EQUIPES')return;const email=prompt('Confirme o e-mail da conta Master que deve permanecer:');if(email!=='estevamgrilo@hotmail.com')return;try{const result=await api('admin/reset-test-data','POST',{confirmation,keepEmail:email});alert(result.message||'Reset concluído.');sessionStorage.removeItem('betel_token');location.replace('/')}catch(e){$('resetStatus').textContent=e.message}}
async function showSchedule(){try{
 const [d,unavailable,sectorData,functionData]=await Promise.all([api('events'),api('unavailability'),api('sectors'),api('functions')]);
 const events=(d.events||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)),assignments=d.assignments||[];
 const blocks=unavailable.unavailability||[];
 const allSectors=sectorData.sectors||[],allFunctions=functionData.functions||[];
 const sectorNames=Object.fromEntries(allSectors.map(s=>[s.id,s.name]));
 const formatDate=s=>{const parts=String(s||'').split('-');return parts.length===3?parts.reverse().join('/'):s};
 const renderEvent=e=>{
  const team=assignments.filter(a=>a.eventId===e.id),mine=team.filter(a=>a.userId===me.id);
  const ownSectors=new Set([...(me.sectors||[]),...mine.map(a=>a.sector)]);
  const sectorIds=[...new Set([...allSectors.map(s=>s.id),...(e.sectors||[]),...team.map(a=>a.sector)])];
  sectorIds.sort((a,b)=>Number(team.some(x=>x.sector===b&&x.userId===me.id))-Number(team.some(x=>x.sector===a&&x.userId===me.id))||String(sectorNames[a]||a).localeCompare(String(sectorNames[b]||b),'pt-BR'));
  const cols=sectorIds.map(s=>{
   const people=team.filter(a=>a.sector===s),functions=[...new Set([...allFunctions.filter(f=>f.sector===s).map(f=>f.name),...people.map(a=>a.functionName)])];
   const isMine=ownSectors.has(s),isAssigned=people.some(a=>a.userId===me.id),enabled=(e.sectors||[]).includes(s);
   const rows=functions.length?functions.map(fn=>{
    const assigned=people.filter(a=>a.functionName===fn);
    return '<div style="padding:10px 0;border-top:1px solid #e7edf5"><div style="font-size:12px;font-weight:700;color:#72839c;margin-bottom:5px">'+esc(fn)+'</div>'+(assigned.length?assigned.map(a=>'<div style="font-weight:'+(a.userId===me.id?'700':'500')+'">'+esc(a.volunteerName||'Voluntário não escalado')+(a.userId===me.id?' <span style="font-size:12px;color:#3268e9">(você)</span>':'')+'</div>').join(''):'<span class="muted">Ninguém escalado ainda</span>')+'</div>'
   }).join(''):people.length?people.map(a=>'<div>'+esc(a.volunteerName||'Voluntário não escalado')+' · '+esc(a.functionName||'Função não definida')+'</div>').join(''):'<p class="muted">Ninguém escalado ainda</p>';
   return '<div style="border:1px solid '+(isAssigned?'#ef9a9a':'#e0e8f3')+';border-radius:14px;padding:16px;background:'+(isAssigned?'#fff0f0':'#fff')+';min-width:0"><h3 style="margin:0 0 12px">'+esc(sectorNames[s]||s)+(isAssigned?' <span style="font-size:12px;color:#c62828">· Você está escalado</span>':'')+'</h3>'+(enabled?'':'<p class="muted" style="font-size:12px">Equipe não incluída neste evento</p>')+rows+'</div>';
  }).join('');
  const mineHTML=mine.length?'<div style="padding:12px;background:#eef5ff;border-radius:12px;margin:12px 0"><b>Minhas funções nesta escala</b>'+mine.map(a=>'<p style="margin:7px 0"><strong>'+esc(a.functionName)+'</strong> · '+esc(sectorNames[a.sector]||a.sector)+'</p>').join('')+'</div>':'<p class="muted">Você não está escalado neste evento.</p>';
  return '<section class="card"><h2>'+esc(e.title||'Evento')+'</h2><p class="muted">'+esc(formatDate(e.date))+' às '+esc(e.time||'Horário não definido')+'</p>'+mineHTML+'<h3>Equipe completa do evento</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">'+cols+'</div></section>';
 };
 const now=new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});
 const dayAfter=(day,offset)=>{const d=new Date(day+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+offset);return d.toISOString().slice(0,10)};
 const dateRows=blocks.slice().sort((a,b)=>a.from.localeCompare(b.from)).map(x=>'<div class="item" style="display:block"><strong>'+esc(formatDate(x.from))+(x.from!==x.to?' até '+esc(formatDate(x.to)):'')+'</strong><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="secondary" type="button" data-remove-unavailable="'+esc(x.id)+'">Liberar período inteiro</button>'+(x.from!==x.to?'<button class="secondary" type="button" data-release-date="'+esc(x.id)+'">Liberar uma data específica</button>':'')+'</div></div>').join('');
 const unavailableCard='<section class="card"><h2>Minhas indisponibilidades</h2><p class="muted">Marque pelo calendário os dias em que não poderá servir, mesmo que ainda não exista um evento cadastrado. Essas datas serão consideradas nas escalas automáticas e manuais.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px"><label>Data inicial<input id="unavailableFrom" type="date" min="'+now+'"></label><label>Data final (opcional)<input id="unavailableTo" type="date" min="'+now+'"></label></div><p class="muted">Para apenas um dia, preencha a data inicial. Para vários dias consecutivos, informe também a data final. Você pode repetir o cadastro para datas separadas.</p><button id="addUnavailable" type="button">Cadastrar indisponibilidade</button><h3>Datas em que não posso servir</h3>'+(blocks.length?dateRows:'<p class="muted">Nenhuma indisponibilidade cadastrada.</p>')+'</section>';
 $('view').innerHTML=unavailableCard+'<div class="card"><h2>Minhas escalas e equipes</h2><p class="muted">Confira suas funções e quem estará servindo com você em cada setor.</p></div>'+(events.length?events.map(renderEvent).join(''):'<div class="card"><p>Nenhum evento cadastrado.</p></div>');
 if($('addUnavailable'))$('addUnavailable').onclick=()=>{
  const from=$('unavailableFrom').value,to=$('unavailableTo').value||from;
  if(!from||from<now||to<from)return alert('Escolha uma data válida, a partir de hoje. A data final não pode ser anterior à inicial.');
  const days=(Date.parse(to+'T12:00:00Z')-Date.parse(from+'T12:00:00Z'))/86400000;
  if(days>365)return alert('Cadastre períodos de até 366 dias por vez.');
  if(blocks.some(x=>x.from<=to&&x.to>=from))return alert('Este período contém datas já bloqueadas. Ajuste as datas ou libere o período anterior.');
  const modal=document.createElement('div');modal.className='notice-overlay';modal.id='unavailableModal';
  modal.innerHTML='<div class="notice-modal"><h2>Confirmar indisponibilidade</h2><p>Você ficará indisponível para novas escalas:</p><p><strong>'+esc(formatDate(from))+(from!==to?' até '+esc(formatDate(to)):'')+'</strong></p><p class="muted">Eventos ainda não cadastrados também serão afetados. Escalas já confirmadas não serão removidas automaticamente.</p><div class="notice-actions"><button class="secondary" id="cancelUnavailable" type="button">Cancelar</button><button id="saveUnavailable" type="button">Salvar indisponibilidade</button></div></div>';
  document.body.append(modal);const close=()=>modal.remove();$('cancelUnavailable').onclick=close;modal.onclick=ev=>{if(ev.target===modal)close()};
  $('saveUnavailable').onclick=async()=>{const btn=$('saveUnavailable');btn.disabled=true;btn.textContent='Salvando...';try{await api('unavailability','POST',{from,to});close();await showSchedule()}catch(err){alert('Não foi possível salvar: '+err.message);btn.disabled=false;btn.textContent='Salvar indisponibilidade'}};
 };
 document.querySelectorAll('[data-remove-unavailable]').forEach(button=>button.onclick=async()=>{if(!confirm('Liberar todo este período para novas escalas?'))return;button.disabled=true;try{await api('unavailability/remove','POST',{id:button.dataset.removeUnavailable});await showSchedule()}catch(err){alert('Não foi possível liberar: '+err.message);button.disabled=false}});
 document.querySelectorAll('[data-release-date]').forEach(button=>button.onclick=()=>{
  const block=blocks.find(x=>x.id===button.dataset.releaseDate);if(!block)return;
  const modal=document.createElement('div');modal.className='notice-overlay';modal.innerHTML='<div class="notice-modal"><h2>Liberar uma data específica</h2><p>Escolha uma data dentro do período '+esc(formatDate(block.from))+' até '+esc(formatDate(block.to))+'. As demais datas continuarão bloqueadas.</p><label>Data a liberar<input type="date" id="releaseSpecificDate" min="'+esc(block.from)+'" max="'+esc(block.to)+'" value="'+esc(block.from)+'"></label><div class="notice-actions"><button class="secondary" id="cancelRelease" type="button">Cancelar</button><button id="confirmRelease" type="button">Liberar data</button></div></div>';document.body.append(modal);
  $('cancelRelease').onclick=()=>modal.remove();$('confirmRelease').onclick=async()=>{const date=$('releaseSpecificDate').value;if(date<block.from||date>block.to)return alert('Selecione uma data dentro do período.');const btn=$('confirmRelease');btn.disabled=true;try{await api('unavailability/remove','POST',{id:block.id,date});modal.remove();await showSchedule()}catch(err){alert('Não foi possível liberar: '+err.message);btn.disabled=false}};
 });
 }catch(e){$('view').textContent=e.message}}
async function showPeople(){if(me.role!=='master'){try{const d=await api('users');$('view').innerHTML='<div class="card"><h2>Voluntários da equipe</h2>'+(d.users||[]).map(u=>'<div class="item">'+esc(u.name)+'</div>').join('')+'</div>'}catch(e){$('view').textContent=e.message}return}try{const d=await api('admin/users');users=d.users;$('view').innerHTML='<div class="card"><h2>Voluntários cadastrados</h2><p>'+users.length+' usuário(s) no banco de dados.</p><div id="list"></div></div><div id="editor"></div>'; $('list').innerHTML=users.map(u=>'<div class="item"><div><b>'+esc(u.name)+'</b><p>'+esc(u.email)+' · '+esc(u.role)+'</p></div><button data-id="'+esc(u.id)+'">Ver / editar</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>editUser(b.dataset.id))}catch(e){$('view').textContent=e.message}}
const fieldLabels={name:'Nome',address:'Endereço',city:'Cidade',state:'Estado',postalCode:'CEP',phone:'Telefone',birthDate:'Data de nascimento',education:'Escolaridade',course:'Formação',profession:'Profissão',maritalStatus:'Estado civil',hasChildren:'Informação sobre filhos',children:'Filhos',favoriteFood:'Comida preferida',hobbies:'Hobbies',interests:'Áreas de interesse',email:'E-mail',password:'Senha',role:'Permissão de acesso',sectors:'Equipes'};
const actionLabels={register:'Cadastro realizado',profile_update:'Cadastro atualizado',role_change:'Permissão alterada',user_update:'Cadastro alterado pelo administrador',login:'Acesso à plataforma',logout:'Saída da plataforma',course_create:'Curso cadastrado',course_update:'Curso atualizado',course_delete:'Curso excluído'};
function renderAudit(a){const label=actionLabels[a.action]||'Atividade registrada';const date=new Date(a.at);const when=Number.isNaN(date.getTime())?'Data não disponível':date.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});let changed=a.changed||a.changes?.profileFields||[];if(!Array.isArray(changed))changed=Object.keys(changed);if(a.changes?.email&&!changed.includes('email'))changed.push('email');if(a.changes?.password&&!changed.includes('password'))changed.push('password');const tags=changed.map(x=>'<span>'+esc(fieldLabels[x]||'Outro dado')+'</span>').join('');return '<div class="audit-entry"><div class="audit-head"><strong>'+esc(label)+'</strong><span class="audit-time">'+esc(when)+'</span></div>'+(tags?'<p class="muted" style="margin:10px 0 3px">Informações alteradas:</p><div class="audit-tags">'+tags+'</div>':'<p class="muted" style="margin:8px 0 0">Registro de atividade do usuário.</p>')+'</div>'}
function toggleChildren(){const yes=$('hasChildren')?.value==='true';if($('childrenSection'))$('childrenSection').style.display=yes?'':'none'}
function addChildRow(child={}){const row=document.createElement('div');row.className='child-row';row.innerHTML='<label>Nome do filho<input class="child-name" placeholder="Nome completo"></label><label>Data de nascimento<input class="child-birth" type="date"></label><span class="child-age">Idade: —</span><button type="button" class="secondary">Remover</button>';row.querySelector('.child-name').value=child.name||'';row.querySelector('.child-birth').value=child.birthDate||'';const update=()=>row.querySelector('.child-age').textContent='Idade: '+age(row.querySelector('.child-birth').value);row.querySelector('.child-birth').onchange=update;row.querySelector('button').onclick=()=>row.remove();update();$('childrenList').append(row)}
function renderChildren(children){$('childrenList').innerHTML='';children.forEach(addChildRow)}
async function editUser(id){selected=users.find(u=>u.id===id);if(!selected)return;const p=selected.profile||{};const fields=[['name','Nome completo'],['phone','Telefone / WhatsApp'],['birthDate','Nascimento','date'],['address','Endereço'],['city','Cidade'],['state','Estado'],['postalCode','CEP'],['education','Escolaridade / formação'],['course','Curso'],['profession','Profissão / emprego'],['maritalStatus','Situação conjugal'],['favoriteFood','Comida preferida'],['hobbies','Hobbies / lazer']];const input=([key,label,type])=>'<label>'+label+'<input data-field="'+key+'" type="'+(type||'text')+'" value="'+esc(p[key]??(key==='name'?selected.name:''))+'"></label>';$('editor').innerHTML='<div class="card"><h2>Cadastro de '+esc(selected.name)+'</h2><div class="grid">'+fields.map(input).join('')+'</div><p>Idade atual: '+age(p.birthDate)+'</p><label>Tem filhos?<select id="hasChildren"><option value="false">Não</option><option value="true" '+(p.hasChildren?'selected':'')+'>Sim</option></select></label><div id="childrenSection"><h3>Filhos cadastrados</h3><div id="childrenList"></div><button type="button" class="secondary" id="addChild">+ Adicionar filho</button></div><p>'+((p.children||[]).map(c=>esc(c.name||'Filho')+': '+age(c.birthDate)+' anos').join(' · ')||'Nenhum filho cadastrado')+'</p><label>Áreas de interesse (separadas por vírgula)<textarea id="interests" rows="2"></textarea></label><label>E-mail<input id="email" type="email" value="'+esc(selected.email)+'"></label><label>Nova senha (deixe em branco para manter a atual)<input id="password" type="password" autocomplete="new-password" minlength="10"></label><button id="save">Salvar alterações</button><div id="msg"></div><h2>Aprendizado do voluntário</h2><div id="userCourses">Carregando cursos...</div><h2>Histórico deste usuário</h2><div id="history">Carregando...</div></div>';renderChildren(p.children||[]);$('addChild').onclick=()=>addChildRow();$('hasChildren').onchange=()=>toggleChildren();toggleChildren();$('interests').value=(p.interests||[]).join(', ');$('save').onclick=saveUser;try{const result=await api('admin/user-courses?userId='+encodeURIComponent(id));if(selected?.id!==id)return;const cs=result.courses||[];const bar=n=>'<div style="height:7px;border-radius:8px;background:#e6ecf5;overflow:hidden;margin:7px 0"><div style="height:100%;width:'+Math.min(100,Math.max(0,n))+'%;background:#3272df"></div></div>';const formatTime=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};$('userCourses').innerHTML=cs.length?cs.map(course=>'<div class="item" style="display:block"><h3>'+esc(course.title)+'</h3><p><strong>'+course.percent+'% do curso concluído</strong> · '+course.completedLessons+' de '+course.totalLessons+' aulas concluídas</p>'+bar(course.percent)+course.lessons.filter(l=>l.started||l.completed||l.percent>0).map(l=>'<div style="padding:10px 0;border-top:1px solid #e8edf5"><b>Aula '+l.number+': '+esc(l.title)+'</b><p>'+l.percent+'% da aula'+(l.completed?' · Concluída':' · Em andamento')+(l.resumeAt?' · Parou em '+formatTime(l.resumeAt):'')+'</p>'+bar(l.percent)+'</div>').join('')+'</div>').join(''):'<p>Este voluntário ainda não iniciou nenhum curso.</p>'}catch(e){if($('userCourses'))$('userCourses').textContent='Não foi possível carregar o aprendizado: '+e.message}
try{const d=await api('admin/user-history?userId='+encodeURIComponent(id));$('history').innerHTML=(d.audit||[]).length?(d.audit||[]).map(renderAudit).join(''):'<p>Nenhuma alteração registrada.</p>'}catch(e){$('history').textContent=e.message}$('editor').scrollIntoView({behavior:'smooth'})}
async function saveUser(){try{const p={};document.querySelectorAll('[data-field]').forEach(x=>p[x.dataset.field]=x.value);p.hasChildren=$('hasChildren').value==='true';p.children=p.hasChildren?[...$('childrenList').querySelectorAll('.child-row')].map(row=>({name:row.querySelector('.child-name').value.trim(),birthDate:row.querySelector('.child-birth').value})).filter(ch=>ch.name||ch.birthDate):[];if(p.children.some(ch=>!ch.name||!ch.birthDate))throw Error('Preencha o nome e a data de nascimento de cada filho.');p.interests=$('interests').value.split(',').map(x=>x.trim()).filter(Boolean);const body={userId:selected.id,email:$('email').value,profile:p};if($('password').value)body.password=$('password').value;await api('admin/user','POST',body);$('msg').style.color='#14865b';$('msg').textContent='Alterações salvas.';await showPeople();editUser(selected.id)}catch(e){$('msg').style.color='#b33d4d';$('msg').textContent=e.message}}
(async()=>{try{const d=await api('me');me=d.user;$('who').textContent=me.name+' · '+({master:'Master',general:'Liderança geral',sector:'Liderança de equipe',volunteer:'Voluntário'}[me.role]||me.role);if(!me.profileComplete&&me.role!=='master'){location.replace('/cadastro.html');return}navigate(['home','schedule','people','learning','courses','manage'].includes(location.hash.slice(1))?location.hash.slice(1):(leader()?'home':'schedule'));await fetchNotices(true);setInterval(()=>fetchNotices(true),60000)}catch(e){sessionStorage.removeItem('betel_token');location.replace('/')}})();
</script></body></html>
