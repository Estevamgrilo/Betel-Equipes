function dashboard(){if(state.role==='volunteer')return volunteerDashboard();const mine=visiblePeople().length;const actions=teamSelect()+`<button class="button primary" data-nav="schedule">${ic('calendar',15)} Ver escalas</button>`;return header('Acompanhe equipes, escalas e decisões importantes em um só lugar.',actions)+`<div class="labelrow" style="margin-bottom:7px"><span class="chip blue">${ic('spark',12)} Dashboard demonstrativo</span><span style="font-size:11px;color:#9ba8ba">Quarta-feira, 28 de outubro de 2026</span></div><div class="grid stat-grid">${statCard('users','blue',mine,'Voluntários cadastrados','Equipe')}${statCard('calendar','green','18','Escalas previstas','60 dias')}${statCard('clock','orange',state.cycleStatus==='published'?'0':'1','Ciclo para aprovação','Ação')}${statCard('graduation','violet',tracks.filter(t=>t.status!=='aprovado').length,'Em trilhas de aprendizado','Ativos')}</div><div class="grid section-grid"><section class="card"><div class="panel-head"><div><h2 class="panel-title">Próximas escalas</h2><div class="panel-caption">Programação geral das próximas semanas</div></div><button class="text-link" data-nav="schedule">Ver calendário ${ic('arrow',13)}</button></div><div class="schedule-list">${teamScheduleList()}</div></section><section class="card"><div class="panel-head"><div><h2 class="panel-title">Precisa da sua atenção</h2><div class="panel-caption">Pendências e notificações prioritárias</div></div><span class="chip warn">${requests.filter(x=>x.status==='pendente').length+tracks.filter(x=>x.status==='revisar').length+(state.cycleStatus!=='published'?1:0)} alertas</span></div><div class="notice-list">${state.cycleStatus!=='published'?`<div class="notice-item"><div class="notice-ico orange">${ic('calendar',17)}</div><div><strong>Ciclo de 60 dias para aprovação</strong><p>Confira e publique a proposta antes de notificar a equipe.</p></div><button class="action-link" data-nav="schedule">Revisar</button></div>`:''}<div class="notice-item"><div class="notice-ico blue">${ic('arrows',17)}</div><div><strong>Pedido de substituição pendente</strong><p>Pedro solicitou cobertura no domingo às 19h.</p></div><button class="action-link" data-nav="requests">Abrir</button></div><div class="notice-item"><div class="notice-ico green">${ic('graduation',17)}</div><div><strong>Trilha concluída</strong><p>Lucas finalizou dois acompanhamentos em sonoplastia.</p></div><button class="action-link" data-nav="learning">Avaliar</button></div><div class="notice-item"><div class="notice-ico orange">${ic('gift',17)}</div><div><strong>Aniversariante da semana</strong><p>Lembrar de celebrar o voluntariado com carinho.</p></div></div></div></section></div><div class="grid section-grid flip"><section class="card"><div class="panel-head"><div><h2 class="panel-title">Distribuição das equipes</h2><div class="panel-caption">Carga de serviço nos últimos meses • ilustrativa</div></div><button class="text-link" data-nav="reports">Relatórios ${ic('chevron',12)}</button></div><div class="chart-lines">${[45,72,54,89,62,75,44,81,64,96,59,74].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div><div class="chart-labels">${['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'].map(m=>`<span>${m}</span>`).join('')}</div></section><section class="card"><div class="panel-head"><div><h2 class="panel-title">Fluxo de publicação</h2><div class="panel-caption">Cada ciclo preserva o histórico anterior</div></div></div><div class="mini-summary"><div><span>Próximo ciclo · 60 dias</span><strong>${state.cycleStatus==='published'?'Publicado':'Em conferência'}</strong></div>${statusBadge()}</div><div style="padding:0 25px 21px"><div class="progress"><span style="width:${state.cycleStatus==='published'?'100':'75'}%"></span></div><p style="font-size:11px;color:#9ba7b8;margin:11px 0 0">Geração automática → revisão do líder → aprovação → publicação.</p></div></section></div>`}
function volunteerDashboard(){return header('Consulte suas escalas, aprendizado e solicitações pessoais.')+`<div class="alert-banner">${ic('info',18)} Você está visualizando o <strong>painel de voluntário</strong>. As funções de gestão e os relatórios administrativos ficam ocultos.</div><div class="grid stat-grid">${statCard('calendar','blue','3','Minhas próximas escalas','Próximas')}${statCard('checkcircle','green','12','Participações cumpridas','Ano')}${statCard('graduation','violet','1/3','Treinamento atual','Etapa')}${statCard('chart','orange','98','Pontos demonstrativos','Saldo')}</div><div class="grid section-grid"><section class="card"><div class="panel-head"><h2 class="panel-title">Minhas próximas participações</h2></div><div class="schedule-list">${[['01','NOV','Câmera lateral','Domingo, 9h • Transmissão'],['08','NOV','Câmera central','Domingo, 19h • Transmissão'],['15','NOV','Acompanhamento','Domingo, 10h15 • Sonoplastia']].map(([d,m,t,meta])=>`<div class="schedule-item"><div class="datebox"><b>${d}</b><small>${m}</small></div><div><div class="schedule-name">${t}</div><div class="schedule-meta">${meta}</div></div><span class="chip blue">Confirmada</span></div>`).join('')}</div></section><section class="card"><div class="panel-head"><h2 class="panel-title">Ações rápidas</h2></div><div style="padding:22px;display:grid;gap:11px"><button class="button" data-action="unavailable">${ic('calendar',16)} Informar indisponibilidade</button><button class="button" data-action="ask-transfer">${ic('arrows',16)} Solicitar substituição</button><button class="button" data-nav="learning">${ic('graduation',16)} Ver minha trilha</button></div></section></div>`}
function schedule(){const actions=teamSelect()+ (canManage()?`<button class="button primary" data-action="generate">${ic('spark',16)} Gerar prévia</button>`:'');const label=state.cycleStatus==='published'?'Ciclo publicado • modificações preservam o histórico':'Ciclo gerado • aguardando conferência e aprovação';return header(state.role==='volunteer'?'Confira suas próximas participações e horários.':'Gerencie os cultos recorrentes, eventos extras e ciclos automáticos de 60 dias.',actions)+`${state.role!=='volunteer'?`<div class="alert-banner">${ic('info',18)} <div><strong>${label}.</strong> Modelo: 60 dias; uma nova proposta é criada quando 75% do período anterior transcorrer. Nada é sobrescrito.</div>${statusBadge()}</div>`:''}<div class="grid section-grid"><section class="card"><div class="toolbar"><div class="left"><div class="cal-nav"><button id="month-prev" aria-label="Mês anterior">‹</button><b>${new Date(state.year,state.month,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase())}</b><button id="month-next" aria-label="Próximo mês">›</button></div></div><div class="right"><div class="seg"><button class="${state.view==='calendar'?'on':''}" data-calview="calendar">Mês</button><button class="${state.view==='list'?'on':''}" data-calview="list">Lista</button></div></div></div>${state.view==='calendar'?monthCalendar():eventList()}</section><section class="card"><div class="panel-head"><div><h2 class="panel-title">${state.role==='volunteer'?'Detalhes da minha escala':'Controle do ciclo'}</h2><div class="panel-caption">Programação e acompanhamento</div></div></div>${state.role==='volunteer'?`<div class="notice-list"><div class="notice-item"><div class="notice-ico blue">${ic('calendar',17)}</div><div><strong>Próxima escala: domingo, 1º de novembro</strong><p>9h · Câmera lateral · Transmissão</p></div></div></div><div style="padding:0 24px 20px"><button class="button" data-action="ask-transfer">Solicitar substituição</button></div>`:`<div class="notice-list"><div class="notice-item"><div class="notice-ico blue">${ic('calendar',18)}</div><div><strong>Ciclo vigente: 60 dias</strong><p>Geração antecipada aos 75% (45º dia).</p></div></div><div class="notice-item"><div class="notice-ico green">${ic('users',18)}</div><div><strong>Respeitar níveis e descanso</strong><p>Distribuição justa e mistura de experiências.</p></div></div><div class="notice-item"><div class="notice-ico orange">${ic('alert',18)}</div><div><strong>Revisão antes de publicar</strong><p>O líder aprova a proposta de sua equipe.</p></div></div></div><div style="padding:0 23px 23px;display:grid;gap:10px"><button class="button" data-action="analyze">${ic('spark',15)} Analisar escalas</button><button class="button primary" ${state.cycleStatus==='published'||!canManage()?'disabled':''} data-action="approve">${ic('checkcircle',15)} ${state.cycleStatus==='published'?'Escala publicada':'Aprovar e publicar'}</button><button class="button" ${!canManage()?'disabled':''} data-action="extra-event">${ic('plus',16)} Adicionar evento extra</button></div>`}</section></div>${canEditAutomatic()?`<div class="auto-link"><button class="button" data-nav="automation">${ic('gear',15)} Configurar geração automática por horário e função</button></div>`:''}${rosterAreaList()}`}
function getSlots(y,m,d){const date=new Date(y,m,d),day=date.getDay();const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let slots=[];if(day===5)slots=[{time:'19h',kind:'Culto de sexta',area:'Todas as equipes'}];if(day===6)slots=[{time:'19h',kind:'Culto de sábado',area:'Todas as equipes'}];if(day===0)slots=[{time:'9h',kind:'Culto de domingo',area:'Todas as equipes'},{time:'10h15',kind:'Culto de domingo',area:'Todas as equipes'},{time:'19h',kind:'Culto de domingo',area:'Todas as equipes'}];return [...slots,...extraEvents.filter(e=>e.date===iso)]} 
function monthCalendar(){const first=new Date(state.year,state.month,1),firstDay=first.getDay(),offset=(firstDay+6)%7,days=new Date(state.year,state.month+1,0).getDate(),total=Math.ceil((days+offset)/7)*7;let c=`<div class="calendar"><div class="weekdays">${['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">`;for(let i=0;i<total;i++){const d=i-offset+1,valid=d>=1&&d<=days,iso=valid?`${state.year}-${String(state.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`:'',slots=valid?getSlots(state.year,state.month,d):[],today=iso==='2026-10-28';c+=`<button class="cal-cell ${!valid?'dim':''} ${state.selected===iso?'selected':''} ${today?'today':''}" ${!valid?'disabled':''} data-date="${iso}" aria-label="${valid?`Dia ${d}, ${slots.length} programações`:''}"><span class="day-no">${valid?d:''}</span>${slots.slice(0,2).map(s=>`<span class="cal-mini ${s.extra?'extra':state.cycleStatus==='draft'?'draft':''}">${s.time} ${s.extra?'Extra':'Culto'}</span>`).join('')}${slots.length>2?`<span class="cal-mini">+${slots.length-2} horário</span>`:''}</button>`;}return c+'</div></div>'+selectedDetail()}
function selectedDetail(){let d=new Date(state.selected+'T12:00:00');if(isNaN(d.getTime()))d=new Date(2026,10,1);const slots=getSlots(d.getFullYear(),d.getMonth(),d.getDate());return `<div class="day-detail"><h4>${d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${slots.length} ${slots.length===1?'escala':'escalas'}</h4><p class="bc-help">Transmissão é sempre decidida por data e horário. <b>A definir</b> não gera equipe de live.</p>${slots.length?slots.map((slot,idx)=>`<div class="detail-block"><div class="detail-row"><div><strong>${esc(slot.time)} · ${esc(slot.kind)}</strong><p>${esc(slot.area)} · ${state.role==='volunteer'?'Consulte sua participação':'Equipe e funções conforme configuração'}</p></div><span class="chip ${slot.extra?'warn':'blue'}">${slot.extra?'Extra':state.cycleStatus==='published'?'Publicado':'Prévia'}</span></div>${broadcastSelector(state.selected,slot,idx)}${permittedBroadcast()?`<small class="bc-sub">${transmissionState(state.selected,slot)==='yes'?'Escala de transmissão liberada para geração.':transmissionState(state.selected,slot)==='no'?'Não serão geradas vagas de transmissão neste horário.':'A transmissão ficará fora da geração até sua decisão.'}</small>`:''}</div>`).join(''):'<p style="font-size:12px;color:#9cabc0">Não há programação recorrente para este dia. Cadastre um evento extra para definir horário, equipes e transmissão.</p>'}</div>`}

function eventList(){let rows=[];for(let d=1;d<=new Date(state.year,state.month+1,0).getDate();d++){const slots=getSlots(state.year,state.month,d);if(slots.length)rows.push({d,slots})}return `<div class="schedule-list">${rows.map(r=>`<div class="schedule-item"><div class="datebox"><b>${r.d}</b><small>${new Date(state.year,state.month,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</small></div><div><div class="schedule-name">${r.slots[0].kind}</div><div class="schedule-meta">${r.slots.map(s=>s.time).join(' · ')} · ${r.slots[0].area}</div></div><span class="chip blue">${r.slots.length} ${r.slots.length===1?'turno':'turnos'}</span></div>`).join('')}</div>`}
function peoplePage(){const a=visiblePeople().filter(p=>(p.name.toLowerCase().includes(state.query.toLowerCase())||p.sector.toLowerCase().includes(state.query.toLowerCase()))&&(state.volFilter==='Todos'||p.level===state.volFilter));return header('Cadastros, níveis individuais e disponibilidade por função.',teamSelect()+`<button class="button primary" ${!canManage()?'disabled':''} data-action="add-person">${ic('plus',15)} Novo voluntário</button>`)+`<div class="auto-link">${canManage()?`<button class="button" data-access-open>${ic('graduation',15)} Gerenciar acessos aos cursos</button>`:''}</div><section class="card"><div class="toolbar"><div class="left"><div class="searchbar">${ic('search',16)}<input id="people-search" placeholder="Buscar por nome ou equipe" value="${esc(state.query)}" aria-label="Buscar voluntário" /></div><select id="people-level" class="filter-select" style="min-width:138px"><option>Todos</option>${levels.map(l=>`<option ${state.volFilter===l?'selected':''}>${l}</option>`).join('')}</select></div><span class="chip muted">${a.length} pessoas</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Voluntário</th><th>Equipe</th><th>Nível</th><th>Escalas</th><th>Situação</th><th></th></tr></thead><tbody>${a.length?a.map(p=>`<tr><td><div class="person-cell">${avatar(p)}<div><strong>${esc(p.name)}</strong><small>Cadastro demonstrativo</small></div></div></td><td>${esc(p.sector)}</td><td><span class="chip blue">${p.level}</span></td><td>${p.service}</td><td><span class="chip ${p.active?'':'muted'}">${p.active?'Ativo':'Em treinamento'}</span></td><td><button class="button small" data-person="${p.id}">Ver perfil ${ic('chevron',12)}</button></td></tr>`).join(''):`<tr><td colspan="6" class="no-data">Nenhum voluntário encontrado.</td></tr>`}</tbody></table></div></section>`}

function courseCard(c){const p=courseProgress(c);const a=quizAverage(c);return `<article class="card ac-course">${acCover(c)}<div class="ac-course-inner"><p>${esc(c.description)}</p><div class="ac-meta"><span>${c.lessons.length} aulas</span><span>${p===100?'Concluído':p>0?'Em andamento':'Disponível'}</span>${a!==null?`<span>Média ${a}%</span>`:''}</div><div class="progress ac-pg"><span style="width:${p}%"></span></div><div class="ac-course-bot"><strong>${p}% da trilha</strong><button class="button small primary" data-edu-open="${c.id}">${p>0?'Continuar':'Explorar'} ${ic('chevron',12)}</button></div></div></article>`}
function educationCatalog(){const cs=courses.filter(enrolled);return `<section class="ac-hero"><div class="ac-hero-copy"><span class="ac-kicker">ACADEMIA BETEL · APRENDER PARA SERVIR</span><h2>Seu próximo passo começa aqui.</h2><p>Cursos por equipe, aulas em sequência, avaliações e espaço para conversar com seus líderes. O conhecimento teórico não altera automaticamente sua habilitação prática.</p>${cs.length?`<button class="ac-whitebtn" data-edu-open="${cs[0].id}">Explorar cursos →</button>`:'<span class="chip">Aguarde liberação de uma equipe</span>'}</div><div class="ac-hero-side">${ic('graduation',130)}</div></section><div class="ac-section-title"><h3>${state.role==='volunteer'?'Continue aprendendo':'Cursos disponíveis por equipe'}</h3>${canEditCourse()?`<button class="button primary small" data-edu-modal="create-course">${ic('plus',14)} Novo curso</button>`:`<small>${cs.length} cursos</small>`}</div><div class="ac-grid">${cs.map(courseCard).join('')||'<div class="card ac-empty">Nenhum curso liberado no seu cadastro. Solicite uma habilitação à liderança.</div>'}</div>${state.role==='volunteer'?`<p class="ac-note">Seus cursos são liberados por área: ${allowedCourses(eduWho()).map(esc).join(', ')||'nenhuma'}. Cada área autorizada começa na aula 1.</p>`:'<p class="ac-note">Os cursos e os acompanhamentos práticos são trilhas independentes. O líder pode cadastrar aulas e perguntas; a promoção técnica exige avaliação própria.</p>'}`}
function educationDetails(c){const p=courseProgress(c),mean=quizAverage(c);return `<div class="ac-detailbar"><button class="ac-back" data-edu-back>← Voltar aos cursos</button>${canEditCourse()?`<button class="button small primary" data-edu-modal="add-lesson">${ic('plus',14)} Cadastrar aula</button>`:''}</div><section class="ac-hero ac-detail-hero" style="background:${areaGradients[c.area]||'linear-gradient(120deg,#19365f,#688bb2)'}"><div class="ac-hero-copy"><span class="ac-kicker">${esc(c.area)} • ${c.lessons.length} aulas</span><h2>${esc(c.title)}</h2><p>${esc(c.description)}</p><p><b>${p}%</b> concluído ${mean!==null?`· média nas avaliações: <b>${mean}%</b>`:''}</p></div><div class="ac-hero-side">${ic(courseIcon[c.area]||'graduation',100)}</div></section><div class="ac-detail-grid"><section class="card"><div class="panel-head"><div><h3 class="panel-title">Aulas e avaliações</h3><p class="panel-caption">A próxima aula abre após vídeo concluído e nota mínima de 70%.</p></div></div><div class="ac-lessonlist">${c.lessons.map((l,i)=>{const locked=!lessonUnlocked(c,i),e=eduEntry(c.id,i),st=e.passed?'Concluída':locked?'Bloqueada':e.percent?'Em progresso':'Disponível';return `<button class="ac-lesson" data-edu-lesson="${i}" ${locked?'disabled':''}><span class="ac-num">${e.passed?ic('check',18):locked?ic('lock',15):String(i+1).padStart(2,'0')}</span><span class="ac-lesson-desc"><strong>${esc(l.title)}</strong><small>${l.duration?Math.round(l.duration/60)+' min':l.demoMinutes+' min (exemplo)'} · ${e.percent}% assistido · ${l.quiz.length} perguntas</small></span><span class="ac-lesson-status">${st}</span></button>`}).join('')||'<div class="ac-empty">Nenhuma aula ainda. O líder pode cadastrar a primeira.</div>'}</div></section><aside class="card ac-sidecard"><h4>Seu progresso no curso</h4><b style="font-size:27px">${p}%</b><div class="progress" style="margin:10px 0 18px"><span style="width:${p}%"></span></div><p><strong>${c.lessons.filter((l,i)=>eduEntry(c.id,i).passed).length} de ${c.lessons.length}</strong> aulas aprovadas.</p><p>Nota média: <strong>${mean===null?'Sem avaliação':mean+'%'}</strong></p><p>Para avançar, conclua o vídeo e acerte pelo menos 70% das perguntas. Você pode refazer avaliações.</p><div class="chip blue">Não altera seu nível técnico</div></aside></div>`}
function educationLesson(c,i){const l=c.lessons[i],e=eduEntry(c.id,i),videoId=videoIdFromUrl(l.youtube),allowQuiz=e.percent>=95,prev=lessonUnlocked(c,i);if(!prev){education.lessonIndex=null;return educationDetails(c)}return `<div class="ac-detailbar"><button class="ac-back" data-edu-course>← ${esc(c.title)}</button><span class="chip blue">Aula ${i+1} de ${c.lessons.length}</span></div><div class="eyebrow">${esc(c.area)} · AULA ${i+1}</div><h2 class="heading" style="margin-bottom:18px">${esc(l.title)}</h2><div class="ac-learning-layout"><div><section class="ac-player">${videoId?`<div id="yt-player-slot" data-video="${videoId}"></div>`:`<div class="ac-player-pl">${ic('graduation',48)}<strong>Área de vídeo da aula</strong><p>O líder poderá cadastrar um link não listado do YouTube. Esta aula fictícia não tem vídeo vinculado.</p><button class="ac-whitebtn" data-edu-simwatch>Simular +25% de visualização</button></div>`}</section><div class="card" style="padding:20px 23px;margin-top:15px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><strong>Progresso de vídeo</strong><b id="edu-watch-percent">${e.percent}%</b></div><div class="progress" style="margin:11px 0"><span id="edu-watch-bar" style="width:${e.percent}%"></span></div><p class="ac-note" style="margin:8px 0">${videoId?'Reprodução pelo YouTube. O protótipo estima trechos reproduzidos enquanto a aba está ativa; ainda não é validação antifraude.':'Por não haver vídeo real, o botão de simulação demonstra o desbloqueio.'}</p><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="chip ${allowQuiz?'':'warn'}" id="edu-watch-ready">${allowQuiz?'Vídeo concluído':'Avaliação libera após 95% assistido'}</span>${e.passed?'<span class="chip">Avaliação aprovada</span>':''}</div></div><section class="card ac-quiz" style="margin-top:16px"><h3>Miniavaliação</h3><p>Nota mínima: 70%. O sistema registra a pontuação da aula e permite novas tentativas.</p>${e.best!==null?`<div class="alert-banner">${ic('info',16)} Melhor resultado: <strong>${e.best}%</strong> em ${e.attempts} tentativa(s).</div>`:''}${l.quiz.map((q,j)=>`<div class="ac-question"><strong>${j+1}. ${esc(q.q)}</strong><div class="ac-options">${q.options.map((o,k)=>`<label><input name="quiz-${j}" type="radio" value="${k}"> ${esc(o)}</label>`).join('')}</div></div>`).join('')}<button class="button primary" id="edu-submit-quiz" data-edu-grade ${!allowQuiz?'disabled':''}>Enviar avaliação</button> <span id="edu-quiz-lock" class="ac-note">${allowQuiz?'':'Conclua o vídeo antes de responder.'}</span></section></div><aside><section class="card ac-sidecard"><h4>Pergunte ao líder</h4><p>Ficou alguma dúvida nesta aula? Envie sua pergunta. Ela ficará vinculada ao conteúdo e aparecerá no painel da liderança.</p><textarea id="edu-doubt-text" class="ac-textarea" maxlength="800" placeholder="O que você gostaria de entender melhor?"></textarea><button class="button primary" style="margin-top:10px" data-edu-send-doubt>Enviar dúvida</button></section><section class="card ac-sidecard" style="margin-top:16px"><h4>Conversa sobre esta aula</h4><div class="ac-doubt-list">${doubts.filter(d=>d.courseId===c.id&&d.lessonIndex===i&&d.who===eduWho()).map(d=>`<div class="ac-doubt" style="padding:0"><small>Minha pergunta</small><p>${esc(d.question)}</p>${d.reply?`<div class="ac-reply"><small>Resposta do líder</small><p style="margin:5px 0">${esc(d.reply)}</p></div>`:'<span class="chip warn">Aguardando resposta</span>'}</div>`).join('')||'<p class="ac-note">Nenhuma dúvida enviada nesta aula.</p>'}</div></section></aside></div>${canEditCourse()?`<div style="margin:17px 0"><button class="button small" data-edu-modal="edit-quiz">${ic('edit',14)} Editar perguntas desta aula</button></div>`:''}`}
function educationManagement(){const cs=courses.filter(c=>canManageArea(c.area)&&(!teamFilter()||teamFilter()===c.area));
 const c=cs.find(x=>x.id===education.courseId)||null;
 return `<div class="ac-section-title"><div><h3>Cadastro de cursos e aulas</h3><p class="panel-caption">Crie cursos, organize a sequência, adicione links do YouTube e perguntas da avaliação.</p></div>${canManage()?`<button class="button primary small" data-edu-modal="create-course">${ic('plus',14)} Criar curso</button>`:''}</div><div class="manual-learning-layout"><aside class="card manage-courses"><div class="panel-head"><h3 class="panel-title">Cursos da equipe</h3></div>${cs.map(z=>`<button class="manage-course ${c?.id===z.id?'active':''}" data-edu-manage="${z.id}"><b>${esc(z.title)}</b><small>${esc(z.area)} · ${z.lessons.length} aulas</small></button>`).join('')||'<p class="ac-note">Nenhum curso disponível para gestão nesta equipe.</p>'}</aside><section class="card manage-lessons">${c?`<div class="manual-heading"><div><span class="eyebrow">${esc(c.area)}</span><h3 class="panel-title">${esc(c.title)}</h3><p class="panel-caption">${c.lessons.length} aulas cadastradas · aprovação mínima de 70%</p></div><button class="button primary small" data-edu-modal="add-lesson">${ic('plus',15)} Nova aula</button></div><div class="manage-lesson-list">${c.lessons.map((l,i)=>`<div class="manual-row"><span class="manual-role"><b>${String(i+1).padStart(2,'0')} · ${esc(l.title)}</b><small>${l.youtube?'Vídeo vinculado':'Sem vídeo'} · ${l.quiz.length} perguntas</small></span><span class="chip ${l.quiz.length?'':'warn'}">${l.quiz.length?'Avaliação criada':'Avaliação pendente'}</span><button class="button small" data-edu-edit-lesson="${i}">Editar aula</button><button class="button small" data-edu-add-question="${i}">${ic('plus',13)} Pergunta</button></div>`).join('')||'<div class="ac-empty">Nenhuma aula. Clique em “Nova aula” para começar.</div>'}</div>`:`<div class="ac-empty manage-placeholder">${ic('graduation',36)}<h3>Selecione um curso</h3><p>Escolha um curso ao lado para cadastrar aulas, links e avaliações.</p></div>`}</section></div><p class="ac-note">Demonstração local: links e perguntas cadastrados ficam neste navegador. A futura versão online armazenará o conteúdo e progresso de cada voluntário no servidor.</p>`;
}
function educationMonitor(){const users=['Camila Rocha','Lucas Ferreira','Marina Carvalho','Rafael Santos'];const rows=users.flatMap(w=>courses.filter(c=>allowedCourses(w).includes(c.area)&&canManageArea(c.area)&&(!teamFilter()||teamFilter()===c.area)).map(c=>({w,c,p:courseProgress(c,w),avg:quizAverage(c,w)})));const avgScores=rows.map(r=>r.avg).filter(x=>x!==null);return `<div class="ac-kpis"><div class="card ac-kpi"><b>${courses.length}</b><span>Cursos cadastrados</span></div><div class="card ac-kpi"><b>${rows.length}</b><span>Matrículas ilustrativas</span></div><div class="card ac-kpi"><b>${avgScores.length?Math.round(avgScores.reduce((a,b)=>a+b)/avgScores.length):0}%</b><span>Média das avaliações</span></div><div class="card ac-kpi"><b>${doubts.filter(x=>!x.reply).length}</b><span>Dúvidas sem resposta</span></div></div><div class="ac-section-title"><h3>Desempenho dos voluntários</h3><small>Dados fictícios demonstrativos</small></div><div class="card ac-monitor"><table><thead><tr><th>Voluntário</th><th>Curso</th><th>Aulas aprovadas</th><th>Nota média</th><th>Avanço</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.w)}</b></td><td>${esc(r.c.area)}</td><td>${r.c.lessons.filter((l,i)=>eduEntry(r.c.id,i,r.w).passed).length} / ${r.c.lessons.length}</td><td>${r.avg===null?'—':r.avg+'%'}</td><td><div class="progress" style="width:105px"><span style="width:${r.p}%"></span></div><small>${r.p}%</small></td><td><button class="button small" data-edu-user="${esc(r.w)}" data-edu-open="${r.c.id}">Ver aulas</button></td></tr>`).join('')}</tbody></table></div><p class="ac-note">O detalhe das avaliações permanece associado à aula e ao aluno. No produto real, esse histórico ficará no servidor, com acesso apenas aos líderes autorizados.</p>`}
function educationDoubts(){const ds=doubts.filter(d=>canManageArea(d.area)&&(!teamFilter()||d.area===teamFilter()));return `<div class="ac-section-title"><h3>Caixa de dúvidas dos cursos</h3><span class="chip warn">${ds.filter(d=>!d.reply).length} aguardando resposta</span></div><div class="ac-doubt-list">${ds.map(d=>`<section class="card ac-doubt"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><strong>${esc(d.who)} · ${esc(d.area)}</strong><span class="chip ${d.reply?'':'warn'}">${d.reply?'Respondida':'Nova dúvida'}</span></div><small>${esc(courses.find(c=>c.id===d.courseId)?.lessons[d.lessonIndex]?.title||'Aula')} · ${esc(d.at)}</small><p>${esc(d.question)}</p>${d.reply?`<div class="ac-reply"><small>Resposta da liderança</small><p>${esc(d.reply)}</p></div>`:canManageArea(d.area)?`<textarea class="ac-textarea" id="edu-answer-${d.id}" placeholder="Escreva sua orientação..."></textarea><button class="button primary small" style="margin-top:9px" data-edu-reply="${d.id}">Responder e notificar (simulação)</button>`:'<span class="chip warn">Somente leitura nesta equipe</span>'}</section>`).join('')||'<div class="card ac-empty">Não há dúvidas neste filtro.</div>'}</div>`}
function learningPage(){const filtered=tracks.filter(t=>state.role!=='volunteer'&&(!teamFilter()||t.area===teamFilter())||state.role==='volunteer'&&t.person==='Camila Rocha');let body='';if(education.tab==='courses'){if(education.courseId){const c=courses.find(x=>x.id===education.courseId);body=c&&enrolled(c)?(education.lessonIndex===null?educationDetails(c):educationLesson(c,education.lessonIndex)):educationCatalog()}else body=educationCatalog()}else if(education.tab==='manage'&&state.role!=='volunteer')body=educationManagement();else if(education.tab==='monitor'&&state.role!=='volunteer')body=educationMonitor();else if(education.tab==='doubts'&&state.role!=='volunteer')body=educationDoubts();else body=`<div class="alert-banner">${ic('graduation',20)} <div><strong>Prática supervisionada.</strong> Esta trilha é separada dos cursos. O líder valida habilidades técnicas após os acompanhamentos.</div></div><div class="training-grid">${filtered.map(t=>{const p=people.find(x=>x.name===t.person)||{name:t.person,initials:'BV'};return `<section class="card training-card"><div class="head">${avatar(p,42)}<div><h3>${t.person}</h3><p>${t.area} · ${t.status==='revisar'?'Aguardando validação':'Em acompanhamento'}</p></div></div><div class="step-note"><strong>${t.done} de ${t.total} acompanhamentos</strong><span>${Math.round(100*t.done/t.total)}%</span></div><div class="progress"><span style="width:${100*t.done/t.total}%"></span></div><div style="margin-top:17px;font-size:11px;color:#94a2b4">Instrutor: ${t.mentor}</div><div class="foot"><small>${t.status==='revisar'?'Etapa concluída':'Em treinamento'}</small>${t.status==='revisar'&&canManageArea(t.area)&&(!teamFilter()||teamFilter()===t.area)?`<button class="button small primary" data-track="${t.id}">Avaliar</button>`:`<span class="chip blue">${t.status==='aprovado'?'Aprovado':'Em curso'}</span>`}</div></section>`}).join('')||'<div class="card no-data">Nenhuma trilha prática neste filtro.</div>'}</div>`;
return header(state.role==='volunteer'?'Aulas, avaliações e acompanhamento da sua jornada de capacitação.':'Gerencie cursos, avalie o progresso teórico e acompanhe o desenvolvimento prático.',state.role==='volunteer'?'':teamSelect())+educationTabs()+body}
// Captura de trechos efetivamente reproduzidos; nunca marca vídeo como visto apenas porque o usuário saltou ao final.
let eduYT=null,eduYTtimer=null,eduYTkey=null;
function videoIdFromUrl(u){if(!u)return null;try{const url=new URL(u);if(['youtu.be','www.youtu.be'].includes(url.hostname))return /^[\w-]{11}$/.test(url.pathname.slice(1))?url.pathname.slice(1):null;if(['youtube.com','www.youtube.com','m.youtube.com','www.youtube-nocookie.com'].includes(url.hostname)){let id=url.searchParams.get('v')||url.pathname.match(/\/(?:embed|shorts|live)\/([\w-]{11})/)?.[1];return /^[\w-]{11}$/.test(id||'')?id:null}}catch(e){}return null}
window.onYouTubeIframeAPIReady=function(){initEducationVideo()};
function initEducationVideo(){clearInterval(eduYTtimer);eduYTtimer=null;try{eduYT?.destroy()}catch(e){}eduYT=null;const slot=document.getElementById('yt-player-slot');if(!slot||!window.YT?.Player)return;const videoId=slot.dataset.video;if(!videoId)return;const c=courses.find(x=>x.id===education.courseId),i=education.lessonIndex;if(!c||i===null)return;const e=eduEntry(c.id,i);const watchedSeconds=new Set(e.watched||[]);eduYTkey=`${eduWho()}|${c.id}|${i}`;
try{eduYT=new YT.Player('yt-player-slot',{height:'100%',width:'100%',videoId,playerVars:{playsinline:1,rel:0},events:{onReady:ev=>{const sec=Math.floor(ev.target.getDuration());if(sec>0){e.duration=sec;c.lessons[i].duration=sec;persistEducation()}},onStateChange:ev=>{clearInterval(eduYTtimer);eduYTtimer=null;if(ev.data===YT.PlayerState.PLAYING){let last=ev.target.getCurrentTime();eduYTtimer=setInterval(()=>{if(eduYTkey!==`${eduWho()}|${education.courseId}|${education.lessonIndex}`||!eduYT)return;const now=eduYT.getCurrentTime(),dur=eduYT.getDuration();if(dur>0){e.duration=Math.floor(dur);c.lessons[i].duration=Math.floor(dur)}const delta=now-last;if(delta>=0&&delta<=2.6&&dur>0&&document.visibilityState==='visible'){for(let sec=Math.max(0,Math.floor(last));sec<=Math.floor(now);sec++)watchedSeconds.add(sec);e.watched=Array.from(watchedSeconds);const all=Math.ceil(dur);e.percent=Math.min(100,Math.round(100*watchedSeconds.size/all));persistEducation();updateEducationWatch(e)}last=now},1000)}else{persistEducation();updateEducationWatch(e)}}}})}catch(e){console.warn('Player indisponível',e)}}
function updateEducationWatch(e){const label=document.querySelector('#edu-watch-percent'),bar=document.querySelector('#edu-watch-bar'),ready=document.querySelector('#edu-watch-ready'),submit=document.querySelector('#edu-submit-quiz'),lock=document.querySelector('#edu-quiz-lock');if(label)label.textContent=e.percent+'%';if(bar)bar.style.width=e.percent+'%';if(ready){ready.textContent=e.percent>=95?'Vídeo concluído':'Avaliação libera após 95% assistido';ready.className='chip '+(e.percent>=95?'':'warn')}if(submit)submit.disabled=e.percent<95;if(lock)lock.textContent=e.percent>=95?'':'Conclua o vídeo antes de responder.'}
function loadYoutubeApi(){if(window.YT?.Player){initEducationVideo();return}if(!document.getElementById('edu-yt-api')){const scr=document.createElement('script');scr.id='edu-yt-api';scr.src='https://www.youtube.com/iframe_api';document.head.appendChild(scr)}}
function eduModal(type){let title='',body='',actions='';const c=courses.find(x=>x.id===education.courseId),l=c?.lessons[education.lessonIndex];if(type==='create-course'){title='Criar curso';body=`<div class="field"><label>Equipe / área</label><select id="ac-newarea">${['Sonoplastia','Transmissão','Projeção','Iluminação','Mídia'].filter(canManageArea).map(a=>`<option>${a}</option>`).join('')}</select></div><div class="field"><label>Nome do curso</label><input id="ac-newtitle" placeholder="Ex.: Introdução à mesa de som"></div><div class="field"><label>Descrição</label><input id="ac-newdesc" placeholder="O que será ensinado?"></div>`;actions='<button class="button primary" data-edu-save="course">Criar curso</button>'}else if(type==='add-lesson'){title='Cadastrar nova aula';body=`<p>Curso: <b>${esc(c?.title||'')}</b>. A nova aula entra no final da sequência.</p><div class="field"><label>Título da aula</label><input id="ac-lesson-title" placeholder="Ex.: Ajustando microfones"></div><div class="field"><label>Link não listado do YouTube</label><input id="ac-lesson-youtube" type="url" placeholder="https://youtu.be/..."></div><p class="ac-note">A duração será lida pelo reprodutor quando o vídeo carregar. Não é necessário preencher tempo manualmente.</p>`;actions='<button class="button primary" data-edu-save="lesson">Cadastrar aula</button>'}else if(type==='edit-lesson'){title='Editar aula';body=`<p>Curso: <b>${esc(c?.title||'')}</b>.</p><div class="field"><label>Título da aula</label><input id="ac-lesson-title" value="${esc(l?.title||'')}" maxlength="140"></div><div class="field"><label>Link do YouTube</label><input id="ac-lesson-youtube" type="url" value="${esc(l?.youtube||'')}" placeholder="https://youtu.be/..."></div><p class="ac-note">A duração é identificada pelo reprodutor quando o vídeo carrega.</p>`;actions='<button class="button primary" data-edu-save="update-lesson">Salvar alterações</button>'}else if(type==='edit-quiz'){title='Adicionar pergunta à avaliação';body=`<p>${esc(l?.title||'')} · As perguntas atuais serão mantidas.</p><div class="ac-quizbuilder"><label>Pergunta</label><input id="ac-q" placeholder="Digite a pergunta"><div class="field-grid"><div><label>Alternativa A</label><input id="ac-o0"></div><div><label>Alternativa B</label><input id="ac-o1"></div><div><label>Alternativa C</label><input id="ac-o2"></div><div><label>Alternativa D</label><input id="ac-o3"></div></div><label>Alternativa correta</label><select id="ac-correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>`;actions='<button class="button primary" data-edu-save="question">Salvar pergunta</button>'}return `<div class="modal-backdrop" data-backdrop><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><h2>${title}</h2><button class="close" data-close aria-label="Fechar">×</button></div>${body}<div class="modal-actions"><button class="button" data-close>Cancelar</button>${actions}</div></div></div>`}
function eduSave(type){if(!canEditCourse()){toast('Você não tem permissão para administrar este curso.');return}if(type==='course'){const title=document.querySelector('#ac-newtitle')?.value.trim(),area=document.querySelector('#ac-newarea')?.value,description=document.querySelector('#ac-newdesc')?.value.trim();if(!title){alert('Informe o título.');return}if(state.role!=='master'&&area==='Mídia'){toast('Somente a liderança responsável pela Mídia ou o administrador master pode criar esse curso.');return}courses.push({id:Date.now(),area,title,description,lessons:[]});education.courseId=courses.at(-1).id;education.lessonIndex=null}else if(type==='lesson'){const c=courses.find(x=>x.id===education.courseId),title=document.querySelector('#ac-lesson-title')?.value.trim(),youtube=document.querySelector('#ac-lesson-youtube')?.value.trim();if(!title){alert('Informe o título da aula.');return}if(youtube&&!videoIdFromUrl(youtube)){alert('Informe um link válido de vídeo do YouTube.');return}c.lessons.push({id:Date.now(),title,youtube,duration:0,demoMinutes:0,quiz:[]})}else if(type==='update-lesson'){const c=courses.find(x=>x.id===education.courseId),l=c?.lessons[education.lessonIndex],title=document.querySelector('#ac-lesson-title')?.value.trim(),youtube=document.querySelector('#ac-lesson-youtube')?.value.trim();if(!l||!title){alert('Informe o título da aula.');return}if(youtube&&!videoIdFromUrl(youtube)){alert('Informe um link válido do YouTube.');return}l.title=title;l.youtube=youtube;l.duration=0}else if(type==='question'){const c=courses.find(x=>x.id===education.courseId),l=c?.lessons[education.lessonIndex],q=document.querySelector('#ac-q')?.value.trim(),options=[0,1,2,3].map(i=>document.querySelector('#ac-o'+i)?.value.trim());if(!q||options.some(o=>!o)){alert('Preencha a pergunta e as quatro alternativas.');return}l.quiz.push({q,options,answer:+document.querySelector('#ac-correct').value})}state.modal=null;persistEducation();toast('Conteúdo atualizado neste protótipo.');}
function eduActions(el){if(el.hasAttribute('data-edu-tab')){education.tab=el.dataset.eduTab;education.courseId=null;education.lessonIndex=null;education.quizResult=null;render();return true}if(el.hasAttribute('data-edu-manage')){education.tab='manage';education.courseId=+el.dataset.eduManage;education.lessonIndex=null;render();return true}if(el.hasAttribute('data-edu-edit-lesson')){education.lessonIndex=+el.dataset.eduEditLesson;state.modal={type:'edu',subtype:'edit-lesson'};render();return true}if(el.hasAttribute('data-edu-add-question')){education.lessonIndex=+el.dataset.eduAddQuestion;state.modal={type:'edu',subtype:'edit-quiz'};render();return true}if(el.hasAttribute('data-edu-user'))education.selectedLearner=el.dataset.eduUser;if(el.hasAttribute('data-edu-open')){education.tab='courses';education.courseId=+el.dataset.eduOpen;education.lessonIndex=null;render();return true}if(el.hasAttribute('data-edu-lesson')){education.lessonIndex=+el.dataset.eduLesson;render();return true}if(el.hasAttribute('data-edu-back')){education.courseId=null;education.lessonIndex=null;render();return true}if(el.hasAttribute('data-edu-course')){education.lessonIndex=null;render();return true}if(el.hasAttribute('data-edu-modal')){if(!canEditCourse())return true;state.modal={type:'edu',subtype:el.dataset.eduModal};render();return true}if(el.hasAttribute('data-edu-save')){eduSave(el.dataset.eduSave);render();return true}if(el.hasAttribute('data-edu-simwatch')){const e=eduEntry(education.courseId,education.lessonIndex);e.percent=Math.min(100,e.percent+25);persistEducation();render();return true}if(el.hasAttribute('data-edu-grade')){const c=courses.find(x=>x.id===education.courseId),l=c.lessons[education.lessonIndex],e=eduEntry(c.id,education.lessonIndex);if(e.percent<95)return true;if(!l.quiz.length){toast('Ainda não há perguntas cadastradas nesta aula.');return true}const answers=l.quiz.map((q,i)=>document.querySelector(`input[name="quiz-${i}"]:checked`)?.value);if(answers.some(x=>x===undefined)){alert('Responda todas as perguntas.');return true}const score=Math.round(100*answers.filter((a,i)=>+a===l.quiz[i].answer).length/l.quiz.length);e.attempts++;e.best=Math.max(e.best??0,score);if(score>=70)e.passed=true;persistEducation();toast(score>=70?`Avaliação aprovada: ${score}%! Próxima aula liberada.`:`Nota ${score}%. Mínimo 70%. Você pode tentar novamente.`);return true}if(el.hasAttribute('data-edu-send-doubt')){const input=document.querySelector('#edu-doubt-text'),question=input?.value.trim();if(!question||question.length<8){alert('Escreva sua dúvida com pelo menos 8 caracteres.');return true}const c=courses.find(x=>x.id===education.courseId);doubts.unshift({id:Date.now(),who:eduWho(),area:c.area,courseId:c.id,lessonIndex:education.lessonIndex,question,reply:'',at:new Date().toLocaleDateString('pt-BR')});persistEducation();toast('Dúvida enviada à caixa da liderança (simulação).');return true}if(el.hasAttribute('data-edu-reply')){const id=+el.dataset.eduReply,d=doubts.find(x=>x.id===id),text=document.querySelector('#edu-answer-'+id)?.value.trim();if(state.role!=='master'&&(state.role!=='leader'||isReadOnly()||d?.area==='Mídia')){toast('Sem permissão para responder dúvidas desta equipe.');return true}if(!text){alert('Escreva a resposta.');return true}d.reply=text;persistEducation();toast('Resposta registrada na demonstração.');return true}return false}
function requestsPage(){const current=state.role==='volunteer'?requests.filter(r=>r.from==='Camila Rocha'):requests.filter(r=>!teamFilter()||r.area===teamFilter());return header(state.role==='volunteer'?'Acompanhe pedidos e solicite a cobertura de uma escala.':'Confira substituições, indisponibilidades e o histórico imutável de alterações.',(state.role==='volunteer'?`<button class="button primary" data-action="ask-transfer">${ic('plus',15)} Nova solicitação</button>`:teamSelect()))+`<div class="grid request-grid"><section class="card"><div class="panel-head"><div><h2 class="panel-title">Solicitações de substituição</h2><div class="panel-caption">Somente pessoas habilitadas e disponíveis são elegíveis</div></div></div>${current.length?current.map(r=>`<div class="request-card"><div class="request-top"><h4>${r.from} → ${r.to}</h4><span class="chip ${r.status==='aceita'?'':'warn'}">${r.status==='aceita'?'Concluída':'Aguardando aceite'}</span></div><p>${r.area} · ${r.date} · ${r.time}<br/>${r.status==='aceita'?'Mudança registrada com histórico preservado.':'Convite enviado ao substituto. Nenhuma pontuação foi alterada.'}</p><div class="request-actions">${r.status==='pendente'?`<button class="button small primary" data-accept="${r.id}">${ic('check',13)} Simular aceite</button>`:''}<button class="button small" data-audit="${r.id}">Ver detalhes ${ic('chevron',12)}</button></div></div>`).join(''):'<div class="no-data">Nenhuma solicitação para esta equipe.</div>'}</section><section class="card"><div class="panel-head"><div><h2 class="panel-title">Histórico de alterações</h2><div class="panel-caption">Registro de auditoria • dados demonstrativos</div></div></div><div class="audit">${(state.role==='volunteer'?audit.filter(a=>a.desc?.includes('Camila Rocha')):audit).map(a=>`<div class="audit-item"><div class="audit-mark">${ic('clock',15)}</div><div><strong>${esc(a.title)}</strong><p>${esc(a.desc)}</p><p style="margin-top:5px;color:#b1bdcb">${a.ago}</p></div></div>`).join('')}</d function reportsPage(){return header('Indicadores para acompanhar participação, equilíbrio e desenvolvimento.',teamSelect()+`<button class="button" data-action="export">${ic('chart',15)} Exportar resumo</button>`)+`<div class="alert-banner">${ic('info',17)} <div><strong>Indicadores ilustrativos.</strong> A conexão com dados reais e os cálculos de pontuação serão implementados no desenvolvimento.</div></div><div class="grid stat-grid">${statCard('checkcircle','green','186','Participações no período','Exemplo')}${statCard('arrows','orange','12','Substituições concluídas','Exemplo')}${statCard('chart','blue','87%','Equilíbrio das equipes','Exemplo')}${statCard('graduation','violet','5','Trilhas concluídas','Exemplo')}</div><div class="grid section-grid"><section class="card"><div class="panel-head"><div><h2 class="panel-title">Participações por equipe</h2><div class="panel-caption">Comparativo de participações • números fictícios</div></div></div><div style="padding:22px 26px">${[['Transmissão',52],['Sonoplastia',43],['Projeção',36],['Iluminação',31],['Mídia',24]].map(([n,v])=>`<div style="margin-bottom:19px"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px;color:#6e819e"><strong>${n}</strong><b>${v}</b></div><div class="progress" style="height:9px"><span style="width:${v/52*100}%"></span></div></div>`).join('')}</div></section><section class="card"><div class="panel-head"><div><h2 class="panel-title">Critérios do sistema</h2><div class="panel-caption">O que será analisado no sistema completo</div></div></div><div class="notice-list">${[['Equilíbrio de experiência','Iniciantes acompanhados por pessoas habilitadas.'],['Distribuição justa','Rodízio sem sobrecarga de semanas consecutivas.'],['Descanso aos domingos','Evitar repetir voluntários nos três horários.'],['Pontuação auditável','Trocas concluídas: −1 ponto ao solicitante.']].map(([t,d],i)=>`<div class="notice-item"><div class="notice-ico ${i%2?'green':'blue'}">${ic(i===3?'cha else if(m.type==='accept'){const r=requests.find(x=>x.id===m.id);title='Simular aceite da transferência';desc=`${r.to} foi convidado(a) a cobrir a escala de ${r.from}.`;body=`<div class="alert-banner">${ic('arrows',17)} <div><strong>${r.area} · ${r.date} · ${r.time}</strong><br/>Ao aceitar, apenas esta escala será alterada; será registrado −1 ponto para ${r.from} e o líder será avisado.</div></div>`;actions=`<button class="button" data-close>Cancelar</button><button class="button primary" data-confirm="accept" data-id="${r.id}">Aceitar e atualizar</button>`}
