<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Betel Equipes — Redefinir senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#eef3ff,#f9fafc);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2a43}.card{width:min(440px,100%);background:white;padding:34px;border-radius:24px;box-shadow:0 20px 70px #233e7014}h1{font-size:25px}p{color:#718097;line-height:1.5}label{display:block;font-size:13px;font-weight:650;margin:18px 0 6px}input{width:100%;padding:14px;border:1px solid #dce4f0;border-radius:12px;font:inherit}button{width:100%;border:0;border-radius:12px;padding:14px;background:#3268e9;color:white;font:inherit;font-weight:650;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}a{color:#3268e9}#msg{margin:16px 0;line-height:1.5}</style></head><body><main class="card"><a href="/">← Voltar ao login</a><h1 id="title">Esqueci minha senha</h1><p id="description">Informe seu e-mail cadastrado. Enviaremos um link de recuperação válido por 30 minutos.</p><form id="form"><label id="label">E-mail<input id="email" type="email" autocomplete="email" required></label><div id="newFields" hidden><label>Nova senha<input id="password" type="password" minlength="10" autocomplete="new-password"></label><label>Confirmar nova senha<input id="confirm" type="password" minlength="10" autocomplete="new-password"></label></div><button id="submit">Enviar link de recuperação</button></form><div id="msg" role="status"></div></main><script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token'),reset=!!token;if(reset){history.replaceState(null,'','/redefinir-senha.html');$('title').textContent='Criar nova senha';$('description').textContent='Escolha uma nova senha com pelo menos 10 caracteres.';$('label').hidden=true;$('email').required=false;$('newFields').hidden=false;$('password').required=true;$('confirm').required=true;$('submit').textContent='Salvar nova senha'}$('form').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';if(reset&&$('password').value!==$('confirm').value){$('msg').textContent='As senhas não coincidem.';return}const btn=$('submit');btn.disabled=true;try{const r=await fetch(reset?'/api/reset-password':'/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(reset?{token,password:$('password').value}:{email:$('email').value})});const x=await r.json();if(!r.ok)throw Error(x.error||'Não foi possível concluir');$('msg').style.color='#14865b';$('msg').textContent=x.message||'Solicitação concluída.';if(reset){$('form').hidden=true;const a=document.createElement('a');a.href='/';a.textContent='Entrar com a nova senha';$('msg').append(document.createElement('p'),a)}}catch(err){$('msg').style.color='#b33d4d';$('msg').textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
