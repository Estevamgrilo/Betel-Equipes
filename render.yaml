services:
  - type: web
    name: betel-equipes-staging
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: betel-equipes-db
          property: connectionString
      - key: BETEL_SETUP_KEY
        generateValue: true

databases:
  - name: betel-equipes-db
    plan: free
    databaseName: betel_equipes
    user: betel_equipes
